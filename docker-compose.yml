services:
  postgres:
    # pgvector/pgvector bundles the `vector` extension (PostgreSQL 16). Plain
    # postgres:16 does not ship pgvector, which silently disables vector search.
    image: pgvector/pgvector:pg16
    container_name: knowledge-compiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_compiler}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Enables the vector extension on first init (runs only on a fresh volume).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_compiler}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
