services:
  postgres:
    # ParadeDB bundles pg_search (BM25) and pgvector on PostgreSQL 16, so local
    # retrieval can exercise exact lexical and vector signals in one database.
    image: paradedb/paradedb:0.23.4-pg16
    container_name: knowledge-compiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_compiler}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Enables available retrieval extensions on first init (fresh volumes only).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_compiler}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
