services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-compiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_compiler}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_compiler}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
